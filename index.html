r:var(--text-muted); background:color-mix(in srgb, var(--bg) 80%, var(--card)); border-bottom:1px solid var(--border); white-space:nowrap}td{padding:12px; border-top:1px solid var(--border); vertical-align:middle}tr:hover td{background:color-mix(in srgb, var(--bg) 50%, var(--card))}.badge{padding:4px 10px; border-radius:20px; font-size:11px; font-weight:800; display:inline-flex; border:1px solid transparent}.badge-blue{background:var(--primary-light); color:var(--primary); border-color:color-mix(in srgb, var(--primary) 20%, transparent)}.badge-green{background:var(--success-light); color:var(--success)}.badge-red{background:var(--danger-light); color:var(--danger)}.badge-amber{background:var(--warning-light); color:var(--warning)}.badge-gray{background:var(--bg); color:var(--text-muted); border-color:var(--border)}.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn .15s}.modal{background:var(--card); border-radius:24px; width:100%; max-width:720px; max-height:90vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 24px 64px rgba(0,0,0,.2); animation:scaleIn .2s; border:1px solid var(--border)}.modal-header{padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center}.modal-body{padding:24px; overflow-y:auto; flex:1}.modal-footer{padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end}.grid-2{grid-template-columns:repeat(2,1fr)} .grid-3{grid-template-columns:repeat(3,1fr)} .grid-4{grid-template-columns:repeat(4,1fr)}.grid{display:grid; gap:16px}@media(max-width:1024px){.sidebar{transform:translateX(100%)}.sidebar.open{transform:translateX(0)}.main{margin-right:0}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}.flex{display:flex} .flex-col{flex-direction:column} .items-center{align-items:center} .ju ndex:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none}.toast{padding:12px 20px; border-radius:12px; font-size:13px; font-weight:800; color:white; box-shadow:0 8px 24px rgba(0,0,0,.15); pointer-events:auto; animation:slideUp .2s}.toast-success{background:#059669} .toast-error{background:#dc2626}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 35%, transparent); outline-offset:2px}@media(max-width:600px){.page{padding:14px}.header{padding:12px 14px}.card,.stat-card{border-radius:16px;padding:16px}.modal-body{padding:16px}.modal-header{padding:16px}.modal-footer{padding:12px 16px}.btn{min-height:42px}.input{font-size:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast-container" class="toast-container"></div><script>

/* ===== storage.js ===== */
// storage.js - إدارة التخزين والبيانات
const STORAGE_KEY = 'st_george_v2_data';const AUTH_KEY = 'st_george_v2_auth';const THEME_KEY = 'st_george_v2_theme';const SESSION_KEY = 'st_george_session';
function genId() {  return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);}
function defaultData() {  return {    centerSettings: {      name: 'سنتر سان جورج',      address: '',      phone: '',      logo: '',      developerName: 'ENG. Mark Eshak',      developerPhone: '01277482080',      defaultSubscription: 0    },    stages: [      { id: genId(), name: 'المرحلة الابتدائية' },      { id: genId(), name: 'المرحلة الإعدادية' },      { id: genId(), name: 'المرحلة الثانوية' },      { id: genId(), name: 'التأسيس للضعفاء' }    ],    studentStatuses: [      { id: genId(), name: 'نشط' },      { id: genId(), name: 'موقوف' },      { id: genId(), name: 'منقطع' },      { id: genId(), name: 'متخرج' },      { id: genId(), name: 'منقول' },      { id: genId(), name: 'مؤجل' }    ],    teacherStatuses: [      { id: genId(), name: 'نشط' },      { id: genId(), name: 'غير نشط' },      { id: genId(), name: 'إجازة' }    ],    expenseTypes: [],    students: [],    teachers: [],    groups: [],    attendance: [],    teacherAttendance: [],    subscriptions: [],    expenses: []  };}
function loadData() {  try {    const raw = localStorage.getItem(STORAGE_KEY);    if (!raw) {      const d = defaultData();      saveData(d);      return d;    }    const parsed = JSON.parse(raw);    const def = defaultData();    for (const key of Object.keys(def)) {      if (!(key in parsed)) parsed[key] = def[key];    }    return parsed;  } catch (e) {    const d = defaultData();    saveData(d);    return d;  }}
function saveData(data) {  try {    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));    return true;  } catch (e) {    if (e.name === 'QuotaExceededError') {      if (typeof toast !== 'undefined') toast('مساحة التخزين ممتلئة', 'error');    }    return false;  }}
let DB = loadData();
function getStageName(id) { return DB.stages.find(s => s.id === id)?.name || '-'; }function getStatusName(id) { return DB.studentStatuses.find(s => s.id === id)?.name || '-'; }function getTeacherStatusName(id) { return DB.teacherStatuses.find(s => s.id === id)?.name || '-'; }function getGroupName(id) { const g = DB.groups.find(x => x.id === id); return g ? `${g.number} ${g.name || ''}`.trim() : '-'; }function getGroupFull(id) { return DB.groups.find(x => x.id === id) || null; }function getTeacherNames(ids) { if (!ids || !ids.length) return '-'; return ids.map(i => DB.teachers.find(t => t.id === i)?.name || '').filter(Boolean).join('، ') || '-'; }function getStudentName(id) { return DB.students.find(s => s.id === id)?.name || '-'; }function getStudentCode(id) { return DB.students.find(s => s.id === id)?.code || ''; }

/* ===== utils.js ===== */
// utils.js - أدوات مساعدة وأمان
function escapeHtml(str) {  if (str == null) return '';  return String(str)    .replace(/&/g, '&amp;')    .replace(/</g, '&lt;')    .replace(/>/g, '&gt;')    .replace(/"/g, '&quot;')    .replace(/'/g, '&#039;');}
function toast(msg, type = 'success') {  let c = document.getElementById('toast-container');  if (!c) {    c = document.createElement('div');    c.id = 'toast-container';    c.className = 'toast-container';    document.body.appendChild(c);  }  const el = document.createElement('div');  el.className = `toast toast-${type}`;  el.textContent = msg;  c.appendChild(el);  setTimeout(() => {    el.style.opacity = '0';    el.style.transform = 'translateY(10px)';    setTimeout(() => el.remove(), 300);  }, 3200);}
function confirmDialog(title, msg, onConfirm, confirmText = 'تأكيد', cancelText = 'إلغاء') {  const overlay = document.createElement('div');  overlay.className = 'modal-overlay';  overlay.innerHTML = `    <div class="modal" style="max-width:440px">      <div class="modal-header">        <h3 class="font-black" style="font-size:15px">${escapeHtml(title)}</h3>        <button onclick="this.closest('.modal-overlay').remove()" class="btn btn-ghost btn-sm">✕</button>      </div>      <div class="modal-body">        <p class="text-sm" style="line-height:1.8; color:var(--text-muted)">${escapeHtml(msg)}</p>      </div>      <div class="modal-footer">        <button id="cd-cancel" class="btn btn-secondary">${escapeHtml(cancelText)}</button>        <button id="cd-ok" class="btn btn-danger">${escapeHtml(confirmText)}</button>      </div>    </div>  `;  document.body.appendChild(overlay);  overlay.querySelector('#cd-cancel').onclick = () => overlay.remove();  overlay.querySelector('#cd-ok').onclick = () => { overlay.remove(); onConfirm(); };  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });}
function openModal(html) {  const root = document.getElementById('modal-root');  root.innerHTML = `<div class="modal-overlay"><div class="modal">${html}</div></div>`;  const overlay = root.querySelector('.modal-overlay');  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });}
function closeModal() {  document.getElementById('modal-root').innerHTML = '';}
function formatDate(dateStr) {  if (!dateStr) return '-';  try { return new Date(dateStr).toLocaleDateString('ar-EG'); } catch { return dateStr; }}
function formatMonth(monthStr) {  if (!monthStr) return '-';  const [y, m] = monthStr.split('-');  return `${m}/${y}`;}
function debounce(fn, delay) {  let t;  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };}
function isValidCode(code) {  return code && code.trim().length >= 1 && code.trim().length <= 20;}
async function fileToBase64(file) {  if (!file) throw 'لم يتم اختيار ملف';  if (!file.type.startsWith('image/')) throw 'الملف المختار ليس صورة';  if (file.size > 5 * 1024 * 1024) throw 'حجم الصورة كبير جدا - الحد 5MB قبل الضغط';  const dataUrl = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>reject('فشل قراءة الصورة'); r.readAsDataURL(file); });  const img = await new Promise((resolve, reject) => { const el = new Image(); el.onload=()=>resolve(el); el.onerror=()=>reject('تعذر فتح الصورة'); el.src=dataUrl; });  const maxSide = 900; const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));  const canvas = document.createElement('canvas'); canvas.width=Math.max(1,Math.round(img.naturalWidth*scale)); canvas.height=Math.max(1,Math.round(img.naturalHeight*scale)); const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);  return canvas.toDataURL('image/jpeg',0.72);}

/* ===== auth.js ===== */
// auth.js - المصادقة والحماية
const PASSWORD_ITERATIONS = 210000;
function randomSalt() { const bytes = new Uint8Array(16); crypto.getRandomValues(bytes); return bytesToBase64(bytes); }
function bytesToBase64(bytes) { let binary=''; for (const b of bytes) binary += String.fromCharCode(b); return btoa(binary); }
function base64ToBytes(base64) { const binary=atob(base64); const bytes=new Uint8Array(binary.length); for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i); return bytes; }
async function derivePasswordHash(password, saltBase64, iterations = PASSWORD_ITERATIONS) {
  const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2',salt:base64ToBytes(saltBase64),iterations,hash:'SHA-256'}, keyMaterial, 256);
  return bytesToBase64(new Uint8Array(bits));
}
async function verifyPassword(password, auth) { if(!auth?.salt || !auth?.hash) return false; return (await derivePasswordHash(password, auth.salt, auth.iterations || PASSWORD_ITERATIONS)) === auth.hash; }
function getAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { return null; } }
function setAuth(auth) { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }
function isLoggedIn() { return !!sessionStorage.getItem(SESSION_KEY) && !!getAuth(); }
function requireAuth() { if(!isLoggedIn()){ currentPage='login'; render(); return false; } return true; }
async function doSetup() {
  const u=document.getElementById('su-user').value.trim() || 'admin';
  const p=document.getElementById('su-pass').value; const p2=document.getElementById('su-pass2').value;
  if(p.length<8){toast('كلمة المرور يجب أن تتكون من 8 أحرف على الأقل','error');return;}
  if(p!==p2){toast('تأكيد كلمة المرور غير مطابق','error');return;}
  const salt=randomSalt(); const hash=await derivePasswordHash(p,salt);
  setAuth({username:u,hash,salt,iterations:PASSWORD_ITERATIONS,createdAt:new Date().toISOString()});
  sessionStorage.setItem(SESSION_KEY,'1'); render(); toast('تم إنشاء حساب المدير');
}
async function doLogin() {
  const u=document.getElementById('li-user').value.trim(); const p=document.getElementById('li-pass').value; const auth=getAuth();
  try { const valid=auth && auth.username===u && await verifyPassword(p,auth); if(!valid){toast('اسم المستخدم أو كلمة المرور غير صحيحة','error');return;} sessionStorage.setItem(SESSION_KEY,'1'); render(); }
  catch { toast('تعذر التحقق من بيانات الدخول','error'); }
}
function doLogout(){ confirmDialog('تسجيل الخروج','سيتم إنهاء جلسة المدير على هذا الجهاز.',()=>{sessionStorage.removeItem(SESSION_KEY);render();}); }
async function changePassword(){
  const p=document.getElementById('new-pass').value; const p2=document.getElementById('new-pass2').value; if(p.length<8){toast('كلمة المرور يجب أن تتكون من 8 أحرف على الأقل','error');return;} if(p!==p2){toast('تأكيد كلمة المرور غير مطابق','error');return;}
  const auth=getAuth(); if(!auth)return; const salt=randomSalt(); auth.salt=salt; auth.hash=await derivePasswordHash(p,salt); auth.iterations=PASSWORD_ITERATIONS; auth.changedAt=new Date().toISOString(); setAuth(auth); document.getElementById('new-pass').value=''; document.getElementById('new-pass2').value=''; toast('تم تحديث كلمة المرور');
}

/* ===== students.js ===== */
// students.js - إدارة الطلاب الكاملة
let studentSearchQuery = '';let studentFilters = { stage: '', status: '', group: '' };let studentSort = { field: 'name', dir: 'asc' };let studentPage = 1;const STUDENT_PER_PAGE = 20;
function renderStudentsPage() {  const q = (studentSearchQuery || '').toLowerCase().trim();  let list = DB.students.filter(s => {    if (q) {      const inName = s.name.toLowerCase().includes(q);      const inCode = s.code.toLowerCase().includes(q);      const inPhone = (s.phone || '').includes(q);      if (!inName && !inCode && !inPhone) return false;    }    if (studentFilters.stage && s.stageId !== studentFilters.stage) return false;    if (studentFilters.status && s.statusId !== studentFilters.status) return false;    if (studentFilters.group && s.groupId !== studentFilters.group) return false;    return true;  });
  list.sort((a,b) => {    let av = a[studentSort.field] || '';    let bv = b[studentSort.field] || '';    if (studentSort.field === 'stage') { av = getStageName(a.stageId); bv = getStageName(b.stageId); }    if (typeof av === 'string') av = av.toLowerCase();    if (typeof bv === 'string') bv = bv.toLowerCase();    if (av < bv) return studentSort.dir === 'asc' ? -1 : 1;    if (av > bv) return studentSort.dir === 'asc' ? 1 : -1;    return 0;  });
  const total = list.length;  const pages = Math.ceil(total / STUDENT_PER_PAGE);  if (studentPage > pages) studentPage = Math.max(1, pages);  const paginated = list.slice((studentPage-1)*STUDENT_PER_PAGE, studentPage*STUDENT_PER_PAGE);
  return `  <div class="flex flex-col gap-4">    <div class="flex flex-wrap gap-3 justify-between items-center">      <div class="flex gap-2 flex-1 max-w-xl">        <input id="student-search" value="${escapeHtml(studentSearchQuery)}" oninput="handleStudentSearch(this.value)" placeholder="بحث بالاسم أو كود الطالب (من المدرسة)..." class="input" style="flex:1">      </div>      <div class="flex gap-2">        <button onclick="openExcelImport()" class="btn btn-secondary">استيراد Excel</button>        <button onclick="openStudentModal()" class="btn btn-primary">+ إضافة طالب</button>      </div>    </div>
    <div class="card" style="padding:0; overflow:hidden">      <div class="p-4 flex flex-wrap gap-2 items-center" style="background:color-mix(in srgb, var(--bg) 60%, var(--card)); border-bottom:1px solid var(--border)">        <select onchange="studentFilters.stage=this.value; studentPage=1; renderPage()" class="input input-sm" style="width:auto; min-width:140px">          <option value="">كل المراحل</option>          ${DB.stages.map(st => `<option value="${st.id}" ${studentFilters.stage===st.id?'selected':''}>${escapeHtml(st.name)}</option>`).join('')}        </select>        <select onchange="studentFilters.status=this.value; studentPage=1; renderPage()" class="input input-sm" style="width:auto; min-width:130px">          <option value="">كل الحالات</option>          ${DB.studentStatuses.map(st => `<option value="${st.id}" ${studentFilters.status===st.id?'selected':''}>${escapeHtml(st.name)}</option>`).join('')}        </select>        <select onchange="studentFilters.group=this.value; studentPage=1; renderPage()" class="input input-sm" style="width:auto; min-width:160px">          <option value="">كل المجموعات</option>          ${DB.groups.map(g => `<option value="${g.id}" ${studentFilters.group===g.id?'selected':''}>${escapeHtml(g.number)} - ${escapeHtml(g.name||'')}</option>`).join('')}        </select>        <div class="flex gap-2" style="margin-right:auto">          <span class="badge badge-gray">${total} طالب</span>          ${q || studentFilters.stage || studentFilters.status || studentFilters.group ? `<button onclick="clearStudentFilters()" class="btn btn-ghost btn-sm">مسح الفلترة</button>` : ''}        </div>      </div>

function handleStudentSearch(val) {  studentSearchQuery = val;  studentPage = 1;  renderPage();}function clearStudentFilters() {  studentSearchQuery = '';  studentFilters = { stage: '', status: '', group: '' };  studentPage = 1;  const inp = document.getElementById('student-search');  if (inp) inp.value = '';  renderPage();}function sortStudents(field) {  if (studentSort.field === field) {    studentSort.dir = studentSort.dir === 'asc' ? 'desc' : 'asc';  } else {    studentSort.field = field;    studentSort.dir = 'asc';  }  renderPage();}
function openStudentModal(id = null) {  const s = id ? DB.students.find(x => x.id === id) : null;  const isEdit = !!s;  openModal(`    <div class="modal-header">      <h3 class="font-black" style="font-size:16px">${isEdit ? 'تعديل طالب' : 'إضافة طالب جديد'}</h3>      <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>    </div>    <div class="modal-body">      <div class="grid grid-2" style="gap:14px">        <div style="grid-column:1 / -1">          <label class="label">كود الطالب * (يدوي من المدرسة - يمنع التكرار)</label>          <input id="m-code" value="${escapeHtml(s?.code || '')}" class="input" placeholder="مثال: 12345" style="font-family:monospace; font-weight:900">          <div class="text-xs text-muted mt-1">الكود يأتي من المدرسة، يجب أن يكون فريد لكل طالب</div>        </div>        <div style="grid-column:1 / -1">          <label class="label">الاسم الكامل *</label>          <input id="m-name" value="${escapeHtml(s?.name || '')}" class="input" placeholder="الاسم رباعي">        </div>        <div>          <label class="label">تاريخ الميلاد</label>          <input id="m-birth" type="date" value="${escapeHtml(s?.birthDate || '')}" class="input">        </div>        <div>          <label class="label">النوع</label>          <select id="m-gender" class="input">            <option value="">اختر</option>            <option value="ذكر" ${s?.gender==='ذكر'?'selected':''}>ذكر</option>            <option value="أنثى" ${s?.gender==='أنثى'?'selected':''}>أنثى</option>          </select>        </div>        <div>          <label class="label">المرحلة</label>          <select id="m-stage" class="input">            <option value="">اختر المرحلة</option>            ${DB.stages.map(st => `<option value="${st.id}" ${s?.stageId===st.id?'selected':''}>${escapeHtml(st.name)}</option>`).join('')}          </select>        </div>        <div>          <label class="label">الصف الدراسي</label>          <input id="m-grade" value="${escapeHtml(s?.grade || '') async function saveStudent(id) {  const code = document.getElementById('m-code').value.trim();  const name = document.getElementById('m-name').value.trim();  if (!code) { toast('كود الطالب مطلوب', 'error'); return; }  if (!name) { toast('اسم الطالب مطلوب', 'error'); return; }  if (!isValidCode(code)) { toast('كود الطالب غير صالح', 'error'); return; }  if (DB.students.some(s => s.code === code && s.id !== id)) {    toast(`كود الطالب ${code} موجود مسبقا - الأكواد يجب أن تكون فريدة`, 'error');    return;  }
  let obj = id ? DB.students.find(s => s.id === id) : { id: genId(), files: [], createdAt: new Date().toISOString() };  const isNew = !id;
  obj.code = code;  obj.name = name;  obj.birthDate = document.getElementById('m-birth').value;  obj.gender = document.getElementById('m-gender').value;  obj.stageId = document.getElementById('m-stage').value;  obj.grade = document.getElementById('m-grade').value.trim();  obj.school = document.getElementById('m-school').value.trim();  obj.groupId = document.getElementById('m-group').value;  obj.statusId = document.getElementById('m-status').value;  obj.phone = document.getElementById('m-phone').value.trim();  obj.address = document.getElementById('m-address').value.trim();  obj.parentName = document.getElementById('m-parentName').value.trim();  obj.parentRelation = document.getElementById('m-parentRel').value;  obj.parentPhone = document.getElementById('m-parentPhone').value.trim();  obj.registrationDate = document.getElementById('m-reg').value;  obj.notes = document.getElementById('m-notes').value.trim();
  if (obj.groupId) {    const group = DB.groups.find(g => g.id === obj.groupId);    if (group && group.maxStudents) {      const count = DB.students.filter(s => s.groupId === obj.groupId && s.id !== obj.id).length;      if (count >= parseInt(group.maxStudents)) {        toast(`المجموعة ${group.number} ممتلئة (${group.maxStudents} طالب)`, 'error');        return;      }    }  }
  const fileInput = document.getElementById('m-photo');  if (fileInput.files[0]) {    try {      const base64 = await fileToBase64(fileInput.files[0]);      obj.photo = base64;    } catch (e) {      toast(e, 'error');      return;    }  }
  if (isNew) DB.students.push(obj);  saveData(DB);  closeModal();  renderPage();  toast(isNew ? 'تم إضافة الطالب بنجاح' : 'تم تحديث بيانات الطالب');}
function deleteStudent(id) {  const s = DB.students.find(x => x.id === id);  if (!s) return;  confirmDialog('حذف طالب', `هل أنت متأكد من حذف الطالب ${s.name} (${s.code})؟\\nسيتم حذف حضوره واشتراكاته أيضا. لا يمكن التراجع.`, () => {    DB.students = DB.students.filter(x => x.id !== id);    DB.attendance = DB.attendance.filter(a => a.studentId !== id);    DB.subscriptions = DB.subscriptions.filter(sub => sub.studentId !== id);    saveData(DB);    renderPage();    toast('تم حذف الطالب وبياناته المرتبطة');  }, 'حذف نهائي');}

an class="text-muted">التسجيل:</span> ${escapeHtml(s.registrationDate || '-')}</div>          </div>        </div>      </div>
      <div class="grid grid-2 gap-4 mb-6">        <div class="card" style="padding:16px">          <div class="font-black text-sm mb-2">بيانات التواصل</div>          <div class="text-sm"><span class="text-muted">هاتف الطالب:</span> ${escapeHtml(s.phone || '-')}</div>          <div class="text-sm"><span class="text-muted">العنوان:</span> ${escapeHtml(s.address || '-')}</div>          <div class="text-sm mt-2"><span class="text-muted">ولي الأمر:</span> ${escapeHtml(s.parentName || '-')} ${s.parentRelation ? '('+escapeHtml(s.parentRelation)+')' : ''}</div>          <div class="text-sm"><span class="text-muted">رقم ولي الأمر:</span> ${escapeHtml(s.parentPhone || '-')}</div>        </div>        <div class="card" style="padding:16px">          <div class="font-black text-sm mb-2">الإحصائيات</div>          <div class="text-sm"><span class="text-muted">إجمالي الحضور:</span> <b class="text-success">${DB.attendance.filter(a=>a.studentId===id && a.status==='حاضر').length}</b></div>          <div class="text-sm"><span class="text-muted">الغياب:</span> <b class="text-danger">${DB.attendance.filter(a=>a.studentId===id && a.status==='غائب').length}</b></div>          <div class="text-sm"><span class="text-muted">التأخير:</span> <b>${DB.attendance.filter(a=>a.studentId===id && a.status==='متأخر').length}</b></div>          <div class="text-sm"><span class="text-muted">الاشتراكات:</span> ${subs.length} شهر</div>          <div class="text-sm"><span class="text-muted">المدفوع:</span> <b>${subs.reduce((a,b)=>a+Number(b.paid||0),0)} ج</b></div>        </div>      </div>

function parseCSV(text) {  const rows=[]; let row=[]; let cell=''; let quoted=false; for(let i=0;i<text.length;i++){ const ch=text[i]; const next=text[i+1]; if(ch==='"' && quoted && next==='"'){ cell+='"'; i++; continue; } if(ch==='"'){ quoted=!quoted; continue; } if(ch===',' && !quoted){ row.push(cell.trim()); cell=''; continue; } if((ch==='\n' || ch==='\r') && !quoted){ if(ch==='\r' && next==='\n') i++; row.push(cell.trim()); cell=''; if(row.some(v=>v!=='')) rows.push(row); row=[]; continue; } cell+=ch; } row.push(cell.trim()); if(row.some(v=>v!=='')) rows.push(row); return rows;}
function openExcelImport() {  openModal(`    <div class="modal-header">      <h3 class="font-black">استيراد الطلاب</h3>      <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>    </div>    <div class="modal-body">      <div class="card mb-4" style="background:var(--primary-light); border-color:var(--primary)">        <div class="font-bold text-sm mb-2">تعليمات</div>        <div class="text-xs" style="line-height:1.8">          • الملف يجب أن يكون .xlsx أو .xls<br>          • الصف الأول يجب أن يحتوي على: <b>code</b> و <b>name</b> (إجباري)<br>          • الأعمدة الاختيارية: grade, stage, school<br>          • مثال:<br>          <code style="background:var(--card); padding:8px; border-radius:8px; display:block; margin-top:8px; font-family:monospace; font-size:11px">          code | name | grade<br>          101 | أحمد محمد | الثاني الإعدادي<br>          102 | مريم علي | الثالث الابتدائي          </code>          • الأكواد المكررة سيتم تخطيها وإظهارها في الأخطاء<br>          • استيراد XLSX يحتاج مكتبة Excel عند أول استخدام.        </div>      </div>      <input type="file" id="excel-file" accept=".xlsx,.xls,.csv" class="input mb-3">      <div id="excel-preview" class="card" style="max-height:300px; overflow:auto; display:none"></div>      <div id="excel-errors" class="card mt-3" style="display:none; background:var(--danger-light); border-color:var(--danger)"></div>    </div>    <div class="modal-footer">      <button onclick="closeModal()" class="btn btn-secondary">إلغاء</button>      <button onclick="processExcel()" class="btn btn-primary">استيراد الآن</button>    </div>  `);
  document.getElementById('excel-file').addEventListener('change', async e => {    const file = e.target.files[0];    if (!file) return;    const preview = document.getElementById('excel-preview');    preview.style.display = 'block';    preview.innerHTML = '<div class="text-sm">جاري قراءة الملف...</div>';
    try {      let data;      if (file.name.endsWith('.csv')) {        const text = await file.text();        data = text.split('\\n').map(row => row.split(',').map(c => c.trim()));      } else {        if (typeof XLSX === 'undefined') {          preview.innerHTML = '<div class="text-sm">جاري تحميل مكتبة Excel (يحتاج إنترنت أول مرة)...</div>';          await loadXLSXLibrary();        }        const buffer = await file.arrayBuffer();        const wb = XLSX.read(buffer, { type: 'array' });        const ws = wb.Sheets[wb.SheetNames[0]];        data = XLSX.utils.sheet_to_json(ws, { header: 1 });      }      window._excelData = data;      const rows = data.slice(0, 11);      preview.innerHTML = `        <div class="font-black text-sm mb-2">معاينة (أول 10 صفوف من ${data.length-1} طالب)</div>        <div class="table-wrap">          <table>            ${rows.map((row,i) => `<tr style="${i===0?'background:var(--primary-light); font-weight:900':''}">${row.map(c => `<td style="padding:6px; border:1px solid var(--border); font-size:11px">${escapeHtml(String(c||''))}</td>`).join('')}</tr>`).join('')}          </table>        </div>        <div class="text-xs mt-2">إجمالي: ${data.length-1} صف</div>      `;    } catch (err) {      preview.innerHTML = `<div class="text-sm" style="color:var(--danger)">خطأ: ${escapeHtml(err.message || err)}</div>`;    }  });}
function loadXLSXLibrary() {  return new Promise((resolve, reject) => {    if (typeof XLSX !== 'undefined') { resolve(); return; }    const script = document.createElement('script');    script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';    script.onload = () => resolve();    script.onerror = () => reject(new Error('فشل تحميل مكتبة Excel - تأكد من الاتصال بالإنترنت'));    document.head.appendChild(script);  });}
function processExcel() {  const data = window._excelData;  if (!data || data.length < 2) { toast('ملف فارغ أو غير صالح', 'error'); return; }  const headers = data[0].map(h => String(h).toLowerCase().trim());  const codeIdx = headers.findIndex(h => h.includes('code') || h.includes('كود'));  const nameIdx = headers.findIndex(h => h.includes('name') || h.includes('اسم'));  if (codeIdx === -1 || nameIdx === -1) {    toast('يجب وجود عمود code و name في الصف الأول', 'error');    return;  }  const gradeIdx = headers.findIndex(h => h.includes('grade') || h.includes('صف') || h.includes('class'));  const schoolIdx = headers.findIndex(h => h.includes('school') || h.includes('مدرسة'));
  let added = 0;  const errors = [];  const defaultStageId = DB.stages[0]?.id || '';  const defaultStatusId = DB.studentStatuses.find(s => s.name === 'نشط')?.id || DB.studentStatuses[0]?.id || '';
  for (let i = 1; i < data.length; i++) {    const row = data[i];    if (!row || row.length === 0) continue;    const code = String(row[codeIdx] || '').trim();    const name = String(row[nameIdx] || '').trim();    if (!code || !name) {      if (code || name) errors.push(`صف ${i+1}: بيانات ناقصة`);      continue;    }    if (DB.students.some(s => s.code === code)) {      errors.push(`صف ${i+1}: كود مكرر ${code} - موجود مسبقا`);      continue;    }    if (code.length > 20) {      errors.push(`صف ${i+1}: كود طويل جدا ${code}`);      continue;    }    DB.students.push({      id: genId(),      code,      name,      grade: String(row[gradeIdx] || '').trim(),      school: String(row[schoolIdx] || '').trim(),      stageId: defaultStageId,      statusId: defaultStatusId,      groupId: '',      birthDate: '',      gender: '',      phone: '',      address: '',      parentName: '',      parentRelation: '',      parentPhone: '',      registrationDate: new Date().toISOString().slice(0,10),      photo: '',      notes: '',      files: [],      createdAt: new Date().toISOString()    });    added++;  }
  saveData(DB);  const errDiv = document.getElementById('excel-errors');  if (errors.length > 0) {    errDiv.style.display = 'block';    errDiv.innerHTML = `<div class="font-bold text-sm mb-2">أخطاء (${errors.length}):</div><div class="text-xs" style="max-height:100px; overflow:auto">${errors.slice(0,50).map(e => `<div>• ${escapeHtml(e)}</div>`).join('')}</div>${errors.length>50?`<div class="text-xs mt-1">... و ${errors.length-50} خطأ آخر</div>`:''}`;  }  toast(`تم استيراد ${added} طالب بنجاح${errors.length ? ` - ${errors.length} خطأ` : ''}`);  if (added > 0) {    setTimeout(() => { closeModal(); renderPage(); }, 1500);  }}

/* ===== teachers.js ===== */
// teachers.js - إدارة المدرسين
let teacherSearch = '';
function renderTeachersPage() {  const q = (teacherSearch || '').toLowerCase().trim();  let list = DB.teachers.filter(t => {    if (!q) return true;    return t.name.toLowerCase().includes(q) || (t.specialization||'').toLowerCase().includes(q) || (t.subjects||[]).join(' ').toLowerCase().includes(q);  });
  return `  <div class="flex flex-col gap-4">    <div class="flex justify-between items-center flex-wrap gap-3">      <input value="${escapeHtml(teacherSearch)}" oninput="teacherSearch=this.value; renderPage()" placeholder="بحث باسم المدرس أو التخصص أو المادة..." class="input" style="max-width:380px; flex:1">      <button onclick="openTeacherModal()" class="btn btn-primary">+ إضافة مدرس</button>    </div>
    <div class="grid grid-3">      ${list.length===0 ? `        <div class="card empty" style="grid-column:1 / -1">          <div class="empty-icon">👨‍🏫</div>          <div class="font-bold">لا يوجد مدرسون</div>          <div class="text-xs text-muted mt-1">إضافة أول مدرس من زر الإضافة.</div>          <button onclick="openTeacherModal()" class="btn btn-primary btn-sm mt-3">+ إضافة مدرس</button>        </div>      ` : list.map(t => {        const groupsCount = DB.groups.filter(g => g.teacherIds?.includes(t.id)).length;        const studentsCount = DB.students.filter(s => {          const g = DB.groups.find(gr => gr.id === s.groupId);          return g?.teacherIds?.includes(t.id);        }).length;        return `        <div class="card card-hover">          <div class="flex justify-between items-start">            <div class="flex-1">              <div class="font-black" style="font-size:15px">${escapeHtml(t.name)}</div>              <div class="text-xs text-muted mt-1 font-bold">${escapeHtml(t.specialization||'')} ${t.subjects?.length ? '• '+escapeHtml(t.subjects.join('، ')) : ''}</div>              <div class="mt-3 text-xs">                <div>📞 ${escapeHtml(t.phone||'-')} • ${escapeHtml(t.salary||'0')} ج</div>                <div class="mt-1 text-muted">المجموعات: ${groupsCount} • الطلاب: ${studentsCount}</div>                ${t.startDate ? `<div class="mt-1 text-muted">بدأ: ${escapeHtml(t.startDate)}</div>` : ''}              </div>              ${t.notes ? `<div class="mt-2 p-2 rounded-lg text-xs" style="background:var(--bg); border:1px solid var(--border)">${escapeHtml(t.notes)}</div>` : ''}            </div>            <span class="badge ${t.statusId && getTeacherStatusName(t.statusId)==='نشط' ? 'badge-green' : 'badge-gray'}">${escapeHtml(getTeacherStatusName(t.statusId))}</span>          </div>          <div class="flex gap-2 mt-4">            <button onclick="openTeacherModal('${t.id}')" class="btn btn-secondary btn-sm" style="flex:1">تعديل</button>            <button onclick="openTeacherGroups('${t.id}')" class="btn btn-secondary btn-sm" style="flex:1">المجموعات</button>            <button onclick="deleteTeacher('${t.id}')" class="btn btn-ghost btn-sm" style="color:var(--danger)">حذف</button>          </div>        </div>        `;      }).join('')}    </div>  </div>  `;}
function openTeacherModal(id = null) {  const t = id ? DB.teachers.find(x => x.id === id) : null;  openModal(`    <div class="modal-header">      <h3 class="font-black">${t?'تعديل مدرس':'إضافة مدرس جديد'}</h3>      <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>    </div>    <div class="modal-body">      <div class="grid grid-2" style="gap:14px">        <div style="grid-column:1 / -1">          <label class="label">اسم المدرس *</label>          <input id="t-name" value="${escapeHtml(t?.name||'')}" class="input" placeholder="الاسم كامل">        </div>        <div>          <label class="label">التخصص</label>          <input id="t-spec" value="${escapeHtml(t?.specialization||'')}" class="input" placeholder="مثال: رياضيات">        </div>        <div>          <label class="label">المواد (افصل بفاصلة)</label>          <input id="t-subs" value="${escapeHtml(t?.subjects?.join('، ')||'')}" class="input" placeholder="رياضيات، فيزياء">        </div>        <div>          <label class="label">رقم الهاتف</label>          <input id="t-phone" value="${escapeHtml(t?.phone||'')}" class="input">        </div>        <div>          <label class="label">العنوان</label>          <input id="t-address" value="${escapeHtml(t?.address||'')}" class="input">        </div>        <div>          <label class="label">تاريخ بداية العمل</label>          <input id="t-start" type="date" value="${escapeHtml(t?.startDate||'')}" class="input">        </div>        <div>          <label class="label">الحالة</label>          <select id="t-status" class="input">            ${DB.teacherStatuses.map(st => `<option value="${st.id}" ${t?.statusId===st.id?'selected':''}>${escapeHtml(st.name)}</option>`).join('')}          </select>        </div>        <div>          <label class="label">الراتب / المستحقات (ج)</label>          <input id="t-salary" type="number" value="${escapeHtml(t?.salary||'')}" class="input" placeholder="0">        </div>        <div style="grid-column:1 / -1">          <label class="label">ملاحظات</label>          <textarea id="t-notes" class="input" rows="2">${escapeHtml(t?.notes||'')}</textarea>        </div>      </div>    </div>    <div class="modal-footer">      <button onclick="closeModal()" class="btn btn-secondary">إلغاء</button>      <button onclick="saveTeacher('${id||''}')" class="btn btn-primary">حفظ</button>    </div>  `);}
function saveTeacher(id) {  const name = document.getElementById('t-name').value.trim();  if (!name) { toast('اسم المدرس مطلوب', 'error'); return; }  let obj = id ? DB.teachers.find(t => t.id === id) : { id: genId() };  const isNew = !id;  obj.name = name;  obj.specialization = document.getElementById('t-spec').value.trim();  obj.subjects = document.getElementById('t-subs').value.split(/[،,]/).map(s=>s.trim()).filter(Boolean);  obj.phone = document.getElementById('t-phone').value.trim();  obj.address = document.getElementById('t-address').value.trim();  obj.startDate = document.getElementById('t-start').value;  obj.statusId = document.getElementById('t-status').value;  obj.salary = document.getElementById('t-salary').value.trim();  obj.notes = document.getElementById('t-notes').value.trim();  if (isNew) DB.teachers.push(obj);  saveData(DB);  closeModal();  renderPage();  toast(isNew ? 'تم إضافة المدرس' : 'تم تحديث بيانات المدرس');}
function deleteTeacher(id) {  const t = DB.teachers.find(x => x.id === id);  if (!t) return;  const groupsUsing = DB.groups.filter(g => g.teacherIds?.includes(id)).length;  confirmDialog('حذف مدرس', `هل أنت متأكد من حذف المدرس ${t.name}؟\\nيدرس في ${groupsUsing} مجموعة - سيتم إزالته من المجموعات.`, () => {    DB.teachers = DB.teachers.filter(x => x.id !== id);    DB.groups.forEach(g => { if (g.teacherIds) g.teacherIds = g.teacherIds.filter(tid => tid !== id); });    DB.teacherAttendance = DB.teacherAttendance.filter(a => a.teacherId !== id);    saveData(DB);    renderPage();    toast('تم حذف المدرس');  }, 'حذف');}
function openTeacherGroups(id) {  const t = DB.teachers.find(x => x.id === id);  const groups = DB.groups.filter(g => g.teacherIds?.includes(id));  openModal(`    <div class="modal-header">      <h3 class="font-black">مجموعات المدرس - ${escapeHtml(t.name)}</h3>      <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>    </div>    <div class="modal-body">      ${groups.length===0 ? '<div class="empty"><div class="empty-icon">👥</div><div class="text-sm">لا يدرس في أي مجموعة حاليا</div></div>' : `        <div class="grid gap-2">          ${groups.map(g => {            const count = DB.students.filter(s => s.groupId === g.id).length;            return `<div class="card" style="padding:12px; display:flex; justify-content:space-between; align-items:center">              <div><div class="font-bold text-sm">${escapeHtml(g.number)} - ${escapeHtml(g.name||'')}</div><div class="text-xs text-muted">${escapeHtml(getStageName(g.stageId))} • ${count} طالب</div></div>              <button onclick="closeModal(); navTo('groups'); setTimeout(()=>openGroupDetails('${g.id}'),300)" class="btn btn-secondary btn-sm">عرض</button>            </div>`;          }).join('')}        </div>      `}    </div>    <div class="modal-footer">      <button onclick="closeModal()" class="btn btn-secondary">إغلاق</button>    </div>  `);}

/* ===== groups.js ===== */
// groups.js - إدارة المجموعات
function renderGroupsPage() {  return `  <div class="flex flex-col gap-4">    <div class="flex justify-between items-center">      <h3 class="font-black" style="font-size:16px">المجموعات الدراسية - فرع واحد</h3>      <button onclick="openGroupModal()" class="btn btn-primary">+ إضافة مجموعة</button>    </div>
    <div class="grid grid-2">      ${DB.groups.length===0 ? `        <div class="card empty" style="grid-column:1 / -1">          <div class="empty-icon">👥</div>          <div class="font-bold">لا توجد مجموعات</div>          <div class="text-xs text-muted mt-1" style="line-height:1.6">المجموعة تحتوي على رقم المجموعة + الصف + عدد الطلاب + مدرسون بمواد مختلفة<br>ابدأ بإضافة أول مجموعة</div>          <button onclick="openGroupModal()" class="btn btn-primary btn-sm mt-3">+ إضافة مجموعة</button>        </div>      ` : DB.groups.map(g => {        const count = DB.students.filter(s => s.groupId === g.id).length;        const max = g.maxStudents ? parseInt(g.maxStudents) : null;        const percent = max ? Math.min(100, (count/max)*100) : Math.min(100, count*5);        const isFull = max && count >= max;        return `        <div class="card card-hover">          <div class="flex justify-between items-start">            <div class="flex-1">              <div class="font-black" style="font-size:15px">مجموعة ${escapeHtml(g.number)} ${g.name ? '- '+escapeHtml(g.name) : ''}</div>              <div class="text-xs text-muted mt-1 font-bold">${escapeHtml(getStageName(g.stageId))} ${g.grade ? '• '+escapeHtml(g.grade) : ''} ${g.subject ? '• '+escapeHtml(g.subject) : ''}</div>              <div class="mt-2 text-xs">                <div>${escapeHtml(getTeacherNames(g.teacherIds||[]))}</div>                <div class="mt-1">${escapeHtml(g.subscriptionValue || DB.centerSettings.defaultSubscription || '0')} ج • 📅 ${escapeHtml(g.days?.join('، ')||'-')} ⏰ ${escapeHtml(g.startTime||'')} - ${escapeHtml(g.endTime||'')}</div>              </div>              ${g.notes ? `<div class="mt-2 text-xs p-2 rounded-lg" style="background:var(--bg); border:1px solid var(--border)">${escapeHtml(g.notes)}</div>` : ''}            </div>            <span class="badge ${g.status==='نشطة'?'badge-green':g.status==='موقوفة'?'badge-red':'badge-gray'}">${escapeHtml(g.status||'نشطة')}</span>          </div>
          <div class="mt-4">            <div class="flex justify-between items-center text-xs mb-1">              <span class="font-bold"><b style="font-size:15px">${count}</b> / ${max || '∞'} طالب</span>              <span class="${isFull?'text-danger font-bold':'text-muted'}">${isFull ? 'ممتلئة' : percent.toFixed(0)+'% ممتلئة'}</span>            </div>            <div style="height:6px; background:var(--bg); border-radius:10px; overflow:hidden; border:1px solid var(--border)">              <div style="height:100%; width:${percent}%; background:${isFull?'var(--danger)':'var(--primary)'}; border-radius:10px; transition:width .3s"></div>            </div>          </div>
          <div class="flex gap-2 mt-4 flex-wrap">            <button onclick="navToAttendance('${g.id}')" class="btn btn-primary btn-sm" style="flex:1"> حضور</button>            <button onclick="openGroupDetails('${g.id}')" class="btn btn-secondary btn-sm" style="flex:1">الطلاب (${count})</button>            <button onclick="openGroupModal('${g.id}')" class="btn btn-secondary btn-sm">تعديل</button>            <button onclick="deleteGroup('${g.id}')" class="btn btn-ghost btn-sm" style="color:var(--danger)">حذف</button>          </div>        </div>        `;      }).join('')}    </div>  </div>  `;}
function openGroupModal(id = null) {  const g = id ? DB.groups.find(x => x.id === id) : null;  openModal(`    <div class="modal-header">      <h3 class="font-black">${g?'تعديل مجموعة':'إضافة مجموعة جديدة'}</h3>      <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>    </div>    <div class="modal-body">      <div class="grid grid-2" style="gap:14px">        <div>          <label class="label">رقم المجموعة *</label>          <input id="g-number" value="${escapeHtml(g?.number||'')}" class="input" placeholder="مثال: 1 أو A1">        </div>        <div>          <label class="label">اسم المجموعة (اختياري)</label>          <input id="g-name" value="${escapeHtml(g?.name||'')}" class="input" placeholder="مثال: مجموعة المتفوقين">        </div>        <div>          <label class="label">المرحلة</label>          <select id="g-stage" class="input">            <option value="">اختر المرحلة</option>            ${DB.stages.map(s => `<option value="${s.id}" ${g?.stageId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}          </select>        </div>        <div>          <label class="label">الصف</label>          <input id="g-grade" value="${escapeHtml(g?.grade||'')}" class="input" placeholder="مثال: الثاني الإعدادي">        </div>        <div>          <label class="label">المادة</label>          <input id="g-subject" value="${escapeHtml(g?.subject||'')}" class="input" placeholder="مثال: رياضيات - علوم">        </div>        <div>          <label class="label">الحد الأقصى للطلاب</label>          <input id="g-max" type="number" value="${escapeHtml(g?.maxStudents||'')}" class="input" placeholder="مثال: 25">        </div>        <div>          <label class="label">قيمة الاشتراك (ج)</label>          <input id="g-subval" type="number" value="${escapeHtml(g?.subscriptionValue||DB.centerSettings.defaultSubscription||'')}" class="input">        </div>        <div>          <label class="label">حالة المجموعة</label>          <select id="g-status" class="input">            <option value="نشطة" ${g?.status==='نشطة'?'selected':''}>نشطة</option>            <option value="موقوفة" ${g?.status==='موقوفة'?'selected':''}>موقوفة</option>            <option value="مكتملة" ${g?.status==='مكتملة'?'selected':''}>مكتملة</option>          </select>        </div>        <div>          <label class="label">وقت البداية</label>          <input id="g-start" type="time" value="${escapeHtml(g?.startTime||'')}" class="input">        </div>        <div>          <label class="label">وقت النهاية</label>          <input id="g-end" type="time" value="${escapeHtml(g?.endTime||'')}" class="input">        </div>        <div style="grid-column:1 / -1">          <label class="label">أيام الحصص (ثابتة أسبوعيا)</label>          <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-top:8px">            ${['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'].map(d => `              <label class="flex items-center gap-2 p-2 rounded-xl" style="background:var(--bg); border:1px solid var(--border); cursor:pointer; font-size:12px; font-weight:700">                <input type="checkbox" value="${d}" class="g-day" ${g?.days?.includes(d)?'checked':''}> ${d}              </label>            `).join('')}          </div>        </div>        <div style="grid-column:1 / -1">          <label class="label">المدرسون - يمكن اختيار أكثر من مدرس بمواد مختلفة</label>          <div class="card" style="max-height:160px; overflow-y:auto; padding:8px; background:var(--bg)">            ${DB.teachers.length===0 ? '<div class="text-xs text-muted">لا يوجد مدرسون مسجلون حاليا.</div>' : DB.teachers.map(t => `              <label class="flex items-center gap-2 p-2 rounded-lg" style="cursor:pointer; font-size:13px">                <input type="checkbox" value="${t.id}" class="g-teacher" ${g?.teacherIds?.includes(t.id)?'checked':''}>                <span><b>${escapeHtml(t.name)}</b> - ${escapeHtml(t.subjects?.join('، ')||t.specialization||'')}</span>              </label>            `).join('')}          </div>        </div>        <div style="grid-column:1 / -1">          <label class="label">ملاحظات</label>          <textarea id="g-notes" class="input" rows="2" placeholder="ملاحظات عن المجموعة...">${escapeHtml(g?.notes||'')}</textarea>        </div>      </div>    </div>    <div class="modal-footer">      <button onclick="closeModal()" class="btn btn-secondary">إلغاء</button>      <button onclick="saveGroup('${id||''}')" class="btn btn-primary">حفظ المجموعة</button>    </div>  `);}
function saveGroup(id) {  const number = document.getElementById('g-number').value.trim();  if (!number) { toast('رقم المجموعة مطلوب', 'error'); return; }  if (DB.groups.some(g => g.number === number && g.id !== id)) {    toast('رقم المجموعة موجود مسبقا', 'error');    return;  }  let obj = id ? DB.groups.find(g => g.id === id) : { id: genId(), createdAt: new Date().toISOString() };  const isNew = !id;  obj.number = number;  obj.name = document.getElementById('g-name').value.trim();  obj.stageId = document.getElementById('g-stage').value;  obj.grade = document.getElementById('g-grade').value.trim();  obj.subject = document.getElementById('g-subject').value.trim();  obj.maxStudents = document.getElementById('g-max').value.trim();  obj.subscriptionValue = document.getElementById('g-subval').value.trim();  obj.status = document.getElementById('g-status').value;  obj.startTime = document.getElementById('g-start').value;  obj.endTime = document.getElementById('g-end').value;  obj.notes = document.getElementById('g-notes').value.trim();  obj.days = Array.from(document.querySelectorAll('.g-day:checked')).map(c => c.value);  obj.teacherIds = Array.from(document.querySelectorAll('.g-teacher:checked')).map(c => c.value);
  if (isNew) DB.groups.push(obj);  saveData(DB);  closeModal();  renderPage();  toast(isNew ? 'تم إضافة المجموعة' : 'تم تحديث المجموعة');}
function deleteGroup(id) {  const g = DB.groups.find(x => x.id === id);  if (!g) return;  const count = DB.students.filter(s => s.groupId === id).length;  if (count > 0) {    toast(`لا يمكن حذف مجموعة بها ${count} طالب - انقل الطلاب أولا`, 'error');    return;  }  confirmDialog('حذف مجموعة', `هل أنت متأكد من حذف مجموعة ${g.number} ${g.name||''}؟`, () => {    DB.groups = DB.groups.filter(x => x.id !== id);    DB.attendance = DB.attendance.filter(a => a.groupId !== id);    DB.subscriptions = DB.subscriptions.filter(s => s.groupId !== id);    saveData(DB);    renderPage();    toast('تم حذف المجموعة');  }, 'حذف');}
function openGroupDetails(id) {  const g = DB.groups.find(x => x.id === id);  if (!g) return;  const students = DB.students.filter(s => s.groupId === id);  openModal(`    <div class="modal-header">      <h3 class="font-black">طلاب مجموعة ${escapeHtml(g.number)} - ${escapeHtml(g.name||'')}</h3>      <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>    </div>    <div class="modal-body">      <div class="card mb-3" style="padding:12px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px">        <div class="text-xs"><b>${students.length}</b> طالب • ${escapeHtml(getStageName(g.stageId))} • ${escapeHtml(g.grade||'')} • ${escapeHtml(g.subject||'')}</div>        <div class="text-xs">${escapeHtml(getTeacherNames(g.teacherIds||[]))}</div>      </div>      ${students.length===0 ? '<div class="empty"><div class="empty-icon">👥</div><div class="text-sm">لا يوجد طلاب في هذه المجموعة</div><div class="text-xs text-muted mt-1">أضف طلاب من صفحة الطلاب واختر هذه المجموعة</div></div>' : `        <div class="table-wrap">          <table>            <thead><tr><th>الكود</th><th>الاسم</th><th>الحالة</th><th>إجراء</th></tr></thead>            <tbody>              ${students.map(s => `<tr><td style="font-family:monospace; font-weight:800">${escapeHtml(s.code)}</td><td class="font-bold">${escapeHtml(s.name)}</td><td><span class="badge badge-blue">${escapeHtml(getStatusName(s.statusId))}</span></td><td><button onclick="closeModal(); openStudentDetails('${s.id}')" class="btn btn-secondary btn-sm">عرض</button></td></tr>`).join('')}            </tbody>          </table>        </div>      `}    </div>    <div class="modal-footer">      <button onclick="closeModal()" class="btn btn-secondary">إغلاق</button>      <button onclick="closeModal(); navToAttendance('${g.id}')" class="btn btn-primary"> تسجيل حضور</button>    </div>  `);}
function navToAttendance(groupId) {  filters.attGroup = groupId;  filters.attDate = new Date().toISOString().slice(0,10);  attendanceState = {};  navTo('attendance');}

// attendance.js - نظام الحضور السريع
let attendanceState = {};let teacherAttState = {};
function renderAttendancePage() {  const selectedGroup = filters.attGroup || (DB.groups[0]?.id || '');  const date = filters.attDate || new Date().toISOString().slice(0,10);  const groupStudents = DB.students.filter(s => s.groupId === selectedGroup);  const dayAttendance = DB.attendance.filter(a => a.date === date && a.groupId === selectedGroup);
  const present = dayAttendance.filter(a => a.status === 'حاضر').length;  const absent = dayAttendance.filter(a => a.status === 'غائب').length;  const late = dayAttendance.filter(a => a.status === 'متأخر').length;
  return `  <div class="flex flex-col gap-4">    <div class="card flex flex-wrap gap-3 items-end">      <div style="flex:1; min-width:200px">        <label class="label">المجموعة *</label>        <select onchange="filters.attGroup=this.value; attendanceState={}; renderPage()" class="input">          <option value="">اختر مجموعة</option>          ${DB.groups.map(g => {            const count = DB.students.filter(s => s.groupId === g.id).length;            return `<option value="${g.id}" ${selectedGroup===g.id?'selected':''}>${escapeHtml(g.number)} - ${escapeHtml(g.name||'')} (${count} طالب)</option>`;          }).join('')}        </select>      </div>      <div style="min-width:180px">        <label class="label">التاريخ *</label>        <input type="date" value="${escapeHtml(date)}" onchange="filters.attDate=this.value; attendanceState={}; renderPage()" class="input">      </div>      <div class="flex gap-2" style="margin-right:auto; flex-wrap:wrap">        <button onclick="markAllAttendance('حاضر')" class="btn btn-success btn-sm" ${!selectedGroup?'disabled':''}> الكل حاضر</button>        <button onclick="markAllAttendance('غائب')" class="btn btn-secondary btn-sm" ${!selectedGroup?'disabled':''}>الكل غائب</button>        <button onclick="markAllAttendance('متأخر')" class="btn btn-secondary btn-sm" style="background:var(--warning-light); color:var(--warning)" ${!selectedGroup?'disabled':''}>الكل متأخر</button>        <button onclick="saveAttendance()" class="btn btn-primary" ${!selectedGroup?'disabled':''}>حفظ الحضور</button>      </div>    </div>
    ${!selectedGroup ? `      <div class="card empty">        <div class="empty-icon"></div>        <div class="font-bold">اختر مجموعة لبدء تسجيل الحضور</div>        <div class="text-xs text-muted mt-1" style="line-height:1.6">طريقة سريعة: علامة حاضر/غائب/متأخر لكل طالب بضغطة واحدة<br>سيتم منع التكرار لنفس الطالب/المجموعة/التاريخ</div>      </div>    ` : `      <div class="card" style="padding:0; overflow:hidden">        <div class="p-4 flex flex-wrap justify-between gap-3" style="background:color-mix(in srgb, var(--bg) 60%, var(--card)); border-bottom:1px solid var(--border)">          <div class="font-black text-sm">${groupStudents.length} طالب في المجموعة</div>          <div class="flex gap-3 text-xs font-bold flex-wrap">            <span style="color:var(--success)"> حاضر: ${present}</span>            <span style="color:var(--danger)">❌ غائب: ${absent}</span>            <span style="color:var(--warning)">⏰ متأخر: ${late}</span>            <span class="text-muted">إجمالي مسجل: ${dayAttendance.length}</span>          </div>        </div>
        <div class="divide-y">          ${groupStudents.length===0 ? `            <div class="empty">              <div class="empty-icon">👥</div>              <div class="text-sm font-bold">لا يوجد طلاب في هذه المجموعة</div>              <div class="text-xs text-muted mt-1">أضف طلاب من صفحة الطلاب واختر هذه المجموعة</div>              <button onclick="navTo('students')" class="btn btn-primary btn-sm mt-3">إضافة طلاب</button>            </div>          ` : groupStudents.map(s => {            const att = dayAttendance.find(a => a.studentId === s.id);            const status = attendanceState[s.id] !== undefined ? attendanceState[s.id] : (att?.status || '');            return `            <div class="p-4 flex items-center justify-between gap-3" style="transition:background .15s" onmouseover="this.style.background='var(--card-hover)'" onmouseout="this.style.background='transparent'">              <div class="flex items-center gap-3 flex-1 min-w-0">                <div style="width:44px; height:44px; border-radius:50%; background:var(--bg); border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; font-weight:900; flex-shrink:0">                  ${s.photo ? `<img src="${s.photo}" style="width:100%; height:100%; object-fit:cover">` : escapeHtml(s.name.charAt(0))}                </div>                <div class="flex-1 min-w-0">                  <div class="font-bold text-sm" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${escapeHtml(s.name)}</div>                  <div class="text-xs text-muted" style="font-family:monospace">${escapeHtml(s.code)} • ${escapeHtml(getStatusName(s.statusId))}</div>                </div>              </div>              <div class="flex gap-1.5 flex-shrink-0">                <button onclick="setAtt('${s.id}','حاضر')" class="btn btn-sm" style="min-width:64px; ${status==='حاضر'?'background:var(--success); color:white; box-shadow:0 2px 8px rgba(5,150,105,.3)':'background:var(--card); border:1px solid var(--border)'}">حاضر</button>                <button onclick="setAtt('${s.id}','غائب')" class="btn btn-sm" style="min-width:60px; ${status==='غائب'?'background:var(--danger); color:white; box-shadow:0 2px 8px rgba(220,38,38,.3)':'background:var(--card); border:1px solid var(--border)'}">غائب</button>                <button onclick="setAtt('${s.id}','متأخر')" class="btn btn-sm" style="min-width:64px; ${status==='متأخر'?'background:var(--warning); color:white':'background:var(--card); border:1px solid var(--border)'}">متأخر</button>              </div>            </div>            `;          }).join('')}        </div>      </div>
      <div class="card">        <div class="font-black text-sm mb-3">حضور المدرسين - ${escapeHtml(date)}</div>        <div class="grid grid-2">          ${DB.teachers.length===0 ? '<div class="text-xs text-muted">لا يوجد مدرسون</div>' : DB.teachers.map(t => {            const ta = DB.teacherAttendance.find(a => a.date === date && a.teacherId === t.id);            const st = teacherAttState[t.id] !== undefined ? teacherAttState[t.id] : (ta?.status || '');            return `            <div class="flex items-center justify-between p-3 rounded-xl" style="background:var(--bg); border:1px solid var(--border)">              <span class="font-bold text-sm">${escapeHtml(t.name)}</span>              <div class="flex gap-1.5">                <button onclick="setTeacherAtt('${t.id}','حاضر')" class="btn btn-sm" style="${st==='حاضر'?'background:var(--success); color:white':'background:var(--card); border:1px solid var(--border)'}">حاضر</button>                <button onclick="setTeacherAtt('${t.id}','غائب')" class="btn btn-sm" style="${st==='غائب'?'background:var(--danger); color:white':'background:var(--card); border:1px solid var(--border)'}">غائب</button>              </div>            </div>            `;          }).join('')}        </div>        <button onclick="saveTeacherAttendance()" class="btn btn-primary btn-sm mt-3">حفظ حضور المدرسين</button>      </div>    `}  </div>  `;}
function setAtt(studentId, status) {  if (attendanceState[studentId] === status) {    delete attendanceState[studentId];  } else {    attendanceState[studentId] = status;  }  renderPage();}
function markAllAttendance(status) {  const groupId = filters.attGroup;  if (!groupId) { toast('اختر مجموعة أولا', 'error'); return; }  const students = DB.students.filter(s => s.groupId === groupId);  if (students.length === 0) { toast('لا يوجد طلاب في المجموعة', 'error'); return; }  students.forEach(s => attendanceState[s.id] = status);  renderPage();  toast(`تم تحديد الكل: ${status}`);}
function saveAttendance() {  const groupId = filters.attGroup;  const date = filters.attDate || new Date().toISOString().slice(0,10);  if (!groupId) { toast('اختر مجموعة', 'error'); return; }  if (!date) { toast('اختر تاريخ', 'error'); return; }  const entries = Object.entries(attendanceState);  if (entries.length === 0) { toast('لم تحدد حضور أي طالب', 'error'); return; }
  let saved = 0;  entries.forEach(([studentId, status]) => {    if (!status) return;    let existing = DB.attendance.find(a => a.date === date && a.groupId === groupId && a.studentId === studentId);    if (existing) {      existing.status = status;      existing.updatedAt = new Date().toISOString();    } else {      DB.attendance.push({        id: genId(),        date,        groupId,        studentId,        status,        createdAt: new Date().toISOString()      });    }    saved++;  });
  saveData(DB);  attendanceState = {};  renderPage();  toast(`تم حفظ حضور ${saved} طالب بتاريخ ${date} `);}
function setTeacherAtt(teacherId, status) {  if (teacherAttState[teacherId] === status) {    delete teacherAttState[teacherId];  } else {    teacherAttState[teacherId] = status;  }  renderPage();}
function saveTeacherAttendance() {  const date = filters.attDate || new Date().toISOString().slice(0,10);  const entries = Object.entries(teacherAttState);  if (entries.length === 0) { toast('لم تحدد حضور أي مدرس', 'error'); return; }  entries.forEach(([tid, status]) => {    let existing = DB.teacherAttendance.find(a => a.date === date && a.teacherId === tid);    if (existing) existing.status = status;    else DB.teacherAttendance.push({ id: genId(), date, teacherId: tid, status });  });  saveData(DB);  teacherAttState = {};  renderPage();  toast('تم حفظ حضور المدرسين');}

// subscriptions.js - إدارة الاشتراكات
function renderSubscriptionsPage() {  const month = filters.subMonth || new Date().toISOString().slice(0,7);  let list = DB.subscriptions.filter(s => s.month === month);  const totalPaid = list.reduce((a,b) => a + Number(b.paid||0), 0);  const totalRequired = list.reduce((a,b) => a + Number(b.amount||0), 0);
  const lateStudents = DB.students.filter(st => !DB.subscriptions.some(s => s.studentId === st.id && s.month === month));
  return `  <div class="flex flex-col gap-4">    <div class="flex flex-wrap gap-3 justify-between items-center">      <div class="flex gap-3 items-center card" style="padding:10px 16px">        <input type="month" value="${escapeHtml(month)}" onchange="filters.subMonth=this.value; renderPage()" class="input" style="width:auto; font-weight:900">        <span class="badge badge-gray">${list.length} اشتراك</span>        <span class="badge badge-green">${totalPaid} ج محصل</span>        <span class="badge badge-amber">المطلوب ${totalRequired} ج</span>      </div>      <button onclick="openSubscriptionModal()" class="btn btn-primary">+ إضافة اشتراك</button>    </div>
    <div class="card" style="padding:0; overflow:hidden">      <div class="table-wrap" style="border:none; border-radius:0">        <table>          <thead>            <tr>              <th>الطالب</th>              <th>المجموعة</th>              <th>الشهر</th>              <th>المطلوب</th>              <th>المدفوع</th>              <th>المتبقي</th>              <th>التاريخ</th>              <th>إجراء</th>            </tr>          </thead>          <tbody>            ${list.length===0 ? `<tr><td colspan="8" class="empty">لا توجد اشتراكات في ${escapeHtml(month)} - ابدأ بإضافة اشتراك</td></tr>` : list.map(s => {              const paid = Number(s.paid||0);              const req = Number(s.amount||0);              const remain = req - paid;              return `              <tr>                <td>                  <div class="font-bold text-sm">${escapeHtml(getStudentName(s.studentId))}</div>                  <div class="text-xs text-muted" style="font-family:monospace">${escapeHtml(getStudentCode(s.studentId))}</div>                </td>                <td class="text-sm">${escapeHtml(getGroupName(s.groupId))}</td>                <td class="text-sm font-bold">${escapeHtml(s.month)}</td>                <td class="text-sm">${req} ج</td>                <td class="font-black" style="color:${paid>=req?'var(--success)':'var(--warning)'}">${paid} ج</td>                <td class="text-sm ${remain>0?'text-danger font-bold':''}">${remain>0 ? remain+' ج' : 'مكتمل'}</td>                <td class="text-xs">${escapeHtml(s.date||'')}</td>                <td><button onclick="deleteSub('${s.id}')" class="btn btn-ghost btn-sm" style="color:var(--danger)">حذف</button></td>              </tr>              `;            }).join('')}          </tbody>        </table>      </div>    </div>
    <div class="card" style="background:var(--warning-light); border-color:var(--warning)">      <div class="font-black text-sm mb-3">⚠️ الطلاب المتأخرون في ${escapeHtml(month)} (لم يدفعوا) - ${lateStudents.length} طالب</div>      ${lateStudents.length===0 ? '<div class="text-xs">لا توجد متأخرات لهذا الشهر</div>' : `        <div class="flex flex-wrap gap-2">          ${lateStudents.slice(0,50).map(st => `<span class="badge badge-gray" style="background:var(--card)">${escapeHtml(st.name)} (${escapeHtml(st.code)}) - ${escapeHtml(getGroupName(st.groupId))}</span>`).join('')}        </div>        ${lateStudents.length>50 ? `<div class="text-xs mt-2">... و ${lateStudents.length-50} طالب آخر</div>` : ''}      `}    </div>  </div>  `;}
function openSubscriptionModal() {  openModal(`    <div class="modal-header">      <h3 class="font-black">إضافة اشتراك شهري</h3>      <button onclick="closeModal()" class="btn btn-ghost btn-sm">✕</button>    </div>    <div class="modal-body">      <div class="flex flex-col gap-3">        <div>          <label class="label">الطالب *</label>          <select id="sub-student" class="input" onchange="updateSubGroup()">            <option value="">اختر طالب</option>            ${DB.students.map(s => `<option value="${s.id}">${escapeHtml(s.name)} - ${escapeHtml(s.code)} - ${escapeHtml(getGroupName(s.groupId))}</option>`).join('')}          </select>        </div>        <div id="sub-group-display" class="text-xs text-muted"></div>        <div>          <label class="label">الشهر *</label>          <input id="sub-month" type="month" value="${new Date().toISOString().slice(0,7)}" class="input">        </div>        <div class="grid grid-2 gap-3">          <div>            <label class="label">المبلغ المطلوب (ج) *</label>            <input id="sub-amount" type="number" value="${DB.centerSettings.defaultSubscription||''}" class="input" placeholder="مثال: 200">          </div>          <div>            <label class="label">المدفوع (ج) *</label>            <input id="sub-paid" type="number" class="input" placeholder="مثال: 200">          </div>        </div>        <div>          <label class="label">تاريخ الدفع</label>          <input id="sub-date" type="date" value="${new Date().toISOString().slice(0,10)}" class="input">        </div>        <div>          <label class="label">ملاحظات (اختياري)</label>          <input id="sub-notes" class="input" placeholder="ملاحظات...">        </div>      </div>    </div>    <div class="modal-footer">      <button onclick="closeModal()" class="btn btn-secondary">إلغاء</button>      <button onclick="saveSubscription()" class="btn btn-primary">حفظ الاشتراك</button>    </div>  `);}
function updateSubGroup() {  const sid = document.getElementById('sub-student').value;  const st = DB.students.find(s => s.id === sid);  const display = document.getElementById('sub-group-display');  if (st) {    const group = getGroupFull(st.groupId);    const subVal = group?.subscriptionValue || DB.centerSettings.defaultSubscription || 0;    display.innerHTML = `المجموعة: <b>${escapeHtml(getGroupName(st.groupId))}</b> • الاشتراك الافتراضي: ${subVal} ج`;    const amountInput = document.getElementById('sub-amount');    if (amountInput && !amountInput.value) amountInput.value = subVal;  } else {    display.innerHTML = '';  }}
function saveSubscription() {  const studentId = document.getElementById('sub-student').value;  const month = document.getElementById('sub-month').value;  const amount = document.getElementById('sub-amount').value.trim();  const paid = document.getElementById('sub-paid').value.trim();  const date = document.getElementById('sub-date').value;  const notes = document.getElementById('sub-notes').value.trim();
  if (!studentId) { toast('اختر الطالب', 'error'); return; }  if (!month) { toast('اختر الشهر', 'error'); return; }  if (!amount || isNaN(amount)) { toast('المبلغ المطلوب غير صالح', 'error'); return; }  if (!paid || isNaN(paid)) { toast('المبلغ المدفوع غير صالح', 'error'); return; }
  if (DB.subscriptions.some(s => s.studentId === studentId && s.month === month)) {    toast('يوجد اشتراك بالفعل لهذا الطالب في نفس الشهر - احذف القديم أولا', 'error');    return;  }

function printReport() {  const content = window._lastReportHtml;  if (!content) { toast('لا يوجد تقرير للطباعة', 'error'); return; }  const w = window.open('', '_blank');  w.document.write(`    <html dir="rtl" lang="ar">    <head>      <meta charset="UTF-8">      <meta name="viewport" content="width=device-width, initial-scale=1.0">      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">      <title>تقرير ${escapeHtml(window._lastReportType)} - ${escapeHtml(window._lastReportMonth)}</title>      <style>        @page { size: A4; margin: 15mm; }        body { font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }        table { page-break-inside: auto; }        tr { page-break-inside: avoid; page-break-after: auto; }        @media print { button { display: none; } }      </style>    </head>    <body>      ${content}      <script>        setTimeout(() => { window.print(); window.close(); }, 600);      <\/script>    </body>    </html>  `);  w.document.close();}
function downloadReportExcel() {  const type = window._lastReportType;  const month = window._lastReportMonth;  if (!type) { toast('لا يوجد تقرير', 'error'); return; }  let csv = '';  if (type === 'students') {    csv = 'الكود,الاسم,المرحلة,الصف,المجموعة,الحالة\\n';    DB.students.forEach(s => {      csv += `"${s.code}","${s.name}","${getStageName(s.stageId)}","${s.grade||''}","${getGroupName(s.groupId)}","${getStatusName(s.statusId)}"\\n`;    });  } else if (type === 'attendance') {    const atts = DB.attendance.filter(a => a.date.startsWith(month) && a.status === 'حاضر');    csv = 'الطالب,الكود,المجموعة,التاريخ,الحالة\\n';    atts.forEach(a => {      csv += `"${getStudentName(a.studentId)}","${getStudentCode(a.studentId)}","${getGroupName(a.groupId)}","${a.date}","${a.status}"\\n`;    });  } else {    toast('تصدير Excel لهذا التقرير هذا التقرير غير متاح للتصدير بصيغة CSV حاليا.', 'error');    return;  }  const blob = new Blob(['\\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });  const url = URL.createObjectURL(blob);  const a = document.createElement('a');  a.href = url;  a.download = `تقرير-${type}-${month}.csv`;  a.click();  URL.revokeObjectURL(url);  toast('تم تحميل الملف بصيغة CSV');}

function renderBackupPage() {  const size = (new Blob([localStorage.getItem(STORAGE_KEY)||'']).size / 1024).toFixed(1);  return `  <div class="flex flex-col gap-6" style="max-width:800px">    <div class="card">      <h3 class="font-black text-sm mb-2">إنشاء نسخة احتياطية يدوية</h3>      <p class="text-xs text-muted mb-4" style="line-height:1.8">        سيتم حفظ كل بيانات السنتر في ملف JSON واحد تحمله على جهازك.<br>        يشمل: طلاب، مدرسين، مجموعات، حضور، اشتراكات، مصروفات، إعدادات، مراحل، حالات<br>        النظام بدون اتصال والنسخ يدوي كما طلبت - احتفظ بالملف في مكان آمن      </p>      <button onclick="createBackup()" class="btn btn-primary btn-lg">إنشاء وتحميل نسخة الآن</button>      <div class="mt-4 p-3 rounded-xl text-xs" style="background:var(--bg); border:1px solid var(--border); line-height:1.8">        <div>📦 الحجم الحالي: <b>${size} KB</b></div>        <div>الطلاب: ${DB.students.length} • المدرسون: ${DB.teachers.length} • المجموعات: ${DB.groups.length}</div>        <div> الحضور: ${DB.attendance.length} • الاشتراكات: ${DB.subscriptions.length} • المصروفات: ${DB.expenses.length}</div>        <div>🕒 آخر تحديث: ${new Date().toLocaleString('ar-EG')}</div>      </div>    </div>
    <div class="card">      <h3 class="font-black text-sm mb-2">استرجاع نسخة احتياطية</h3>      <div class="p-3 rounded-xl mb-4 text-xs" style="background:var(--warning-light); border:1px solid var(--warning); line-height:1.8">        <div class="font-black">⚠️ تحذير مهم:</div>        <div class="mt-1">          • سيتم استبدال كل البيانات الحالية بالنسخة المسترجعة<br>          • سيقوم النظام تلقائيا بإنشاء نسخة أمان من البيانات الحالية قبل الاسترجاع<br>          • تأكد أن الملف هو نسخة احتياطية صحيحة من نفس النظام<br>          • بعد الاسترجاع سيتم إعادة تحميل النظام تلقائيا        </div>      </div>      <input type="file" id="restore-file" accept=".json" class="input mb-3">      <div id="restore-preview" class="card mb-3 hidden" style="background:var(--bg)"></div>      <button onclick="previewRestore()" class="btn btn-secondary mr-2">👁️ معاينة الملف</button>      <button onclick="restoreBackup()" class="btn btn-primary" style="background:var(--danger)">♻️ استرجاع النسخة</button>    </div>
    <div class="card" style="background:var(--primary-light); border-color:var(--primary)">      <div class="font-bold text-sm mb-2">إرشادات النسخ الاحتياطي</div>      <div class="text-xs" style="line-height:1.8">        • أنشئ نسخة احتياطية دورية<br>        • احتفظ بنسختين: واحدة على الجهاز وواحدة على Google Drive أو USB<br>        • أنشئ نسخة إضافية بعد التغييرات الكبيرة<br>        • ملف الـ JSON يمكن فتحه وقراءته - كل بياناتك فيه<br>        • لو حذفت بيانات بالخطأ، استرجع آخر نسخة احتياطية      </div>    </div>  </div>  `;}
function createBackup() {  const dataStr = localStorage.getItem(STORAGE_KEY);  if (!dataStr) { toast('لا توجد بيانات', 'error'); return; }  try {    const parsed = JSON.parse(dataStr);    parsed._backupMeta = {      createdAt: new Date().toISOString(),      version: 'v2',      centerName: parsed.centerSettings?.name || 'سنتر سان جورج',      counts: {        students: parsed.students?.length || 0,        teachers: parsed.teachers?.length || 0,        groups: parsed.groups?.length || 0,        attendance: parsed.attendance?.length || 0,        subscriptions: parsed.subscriptions?.length || 0,        expenses: parsed.expenses?.length || 0      }    };    const blob = new Blob([JSON.stringify(parsed, null, 2)], { type: 'application/json' });    const url = URL.createObjectURL(blob);    const a = document.createElement('a');    a.href = url;    a.download = `st-george-backup-${new Date().toISOString().slice(0,10)}-${Date.now()}.json`;    a.click();    URL.revokeObjectURL(url);    toast('تم إنشاء وتحميل النسخة الاحتياطية - احتفظ بها في مكان آمن ');  } catch (e) {    toast('خطأ في إنشاء النسخة: ' + e.message, 'error');  }}
function previewRestore() {  const input = document.getElementById('restore-file');  if (!input.files[0]) { toast('اختر ملف أولا', 'error'); return; }  const file = input.files[0];  const reader = new FileReader();  reader.onload = e => {    try {      const parsed = JSON.parse(e.target.result);      const preview = document.getElementById('restore-preview');      preview.classList.remove('hidden');      preview.innerHTML = `        <div class="font-black text-sm mb-2">معاينة النسخة</div>        <div class="text-xs" style="line-height:1.8">          <div>📁 اسم الملف: ${escapeHtml(file.name)}</div>          <div>📦 الحجم: ${(file.size/1024).toFixed(1)} KB</div>          <div>🏢 اسم السنتر: ${escapeHtml(parsed.centerSettings?.name||'غير معروف')}</div>          <div>📅 تاريخ النسخة: ${parsed._backupMeta?.createdAt ? new Date(parsed._backupMeta.createdAt).toLocaleString('ar-EG') : 'غير معروف'}</div>          <div class="mt-2 font-bold">المحتويات:</div>          <div>طلاب: ${parsed.students?.length||0} • مدرسون: ${parsed.teachers?.length||0} • مجموعات: ${parsed.groups?.length||0}</div>          <div> حضور: ${parsed.attendance?.length||0} • اشتراكات: ${parsed.subscriptions?.length||0} • مصروفات: ${parsed.expenses?.length||0}</div>          <div class="mt-2 ${parsed.centerSettings && parsed.stages ? 'text-success' : 'text-danger'} font-bold">            ${parsed.centerSettings && parsed.stages ? ' ملف صالح - يبدو نسخة احتياطية صحيحة' : '❌ ملف غير صالح - ليس نسخة من النظام'}          </div>        </div>      `;    } catch (err) {      const preview = document.getElementById('restore-preview');      preview.classList.remove('hidden');      preview.innerHTML = `<div class="text-sm" style="color:var(--danger)">❌ ملف غير صالح: ${escapeHtml(err.message)} - تأكد أنه ملف JSON صحيح</div>`;    }  };  reader.readAsText(file);}
function restoreBackup() {  const input = document.getElementById('restore-file');  if (!input.files[0]) { toast('اختر ملف النسخة أولا', 'error'); return; }
  confirmDialog('تأكيد الاسترجاع', '⚠️ سيتم استبدال كل البيانات الحالية بالنسخة المسترجعة.\\n\\nسيقوم النظام تلقائيا بإنشاء نسخة أمان من البيانات الحالية قبل الاسترجاع لمنع فقدان البيانات.\\n\\nهل أنت متأكد من الاسترجاع؟', () => {    const reader = new FileReader();    reader.onload = e => {      try {        const parsed = JSON.parse(e.target.result);        // Validation        if (!parsed.students || !parsed.centerSettings || !parsed.stages) {          toast('ملف غير صالح - ليس نسخة احتياطية للنظام (يجب أن يحتوي على students, centerSettings, stages)', 'error');          return;        }

async function saveCenterSettings() {  const name = document.getElementById('set-name').value.trim();  if (!name) { toast('اسم السنتر مطلوب', 'error'); return; }  DB.centerSettings.name = name;  DB.centerSettings.address = document.getElementById('set-address').value.trim();  DB.centerSettings.phone = document.getElementById('set-phone').value.trim();  DB.centerSettings.defaultSubscription = document.getElementById('set-defaultSub').value.trim();  DB.centerSettings.developerName = document.getElementById('set-devName').value.trim();  DB.centerSettings.developerPhone = document.getElementById('set-devPhone').value.trim();
  const logoInput = document.getElementById('set-logo');  if (logoInput.files[0]) {    try {      DB.centerSettings.logo = await fileToBase64(logoInput.files[0]);    } catch (e) { toast(e, 'error'); return; }  }
  saveData(DB);  render();  toast('تم حفظ الإعدادات - ستظهر في التقارير مباشرة');}
function removeLogo() {  DB.centerSettings.logo = '';  saveData(DB);  render();  toast('تم حذف اللوجو - النظام يعمل بدونه');}
function addStage() {  const v = document.getElementById('new-stage').value.trim();  if (!v) { toast('اكتب اسم المرحلة', 'error'); return; }  if (DB.stages.some(s=>s.name===v)) { toast('المرحلة موجودة', 'error'); return; }  DB.stages.push({ id: genId(), name: v });  saveData(DB);  renderPage();  toast('تمت إضافة المرحلة');}function deleteStage(id) {  if (DB.students.some(s=>s.stageId===id) || DB.groups.some(g=>g.stageId===id)) { toast('لا يمكن حذف مرحلة مستخدمة', 'error'); return; }  confirmDialog('حذف مرحلة', 'هل أنت متأكد من حذف هذه المرحلة؟', () => {    DB.stages = DB.stages.filter(s=>s.id!==id);    saveData(DB);    renderPage();    toast('تم الحذف');  });}function addStudentStatus() {  const v = document.getElementById('new-ststatus').value.trim();  if (!v) return;  if (DB.studentStatuses.some(s=>s.name===v)) { toast('موجودة', 'error'); return; }  DB.studentStatuses.push({ id: genId(), name: v });  saveData(DB); renderPage(); toast('تمت الإضافة');}function deleteStudentStatus(id) {  if (DB.students.some(s=>s.statusId===id)) { toast('مستخدمة - لا يمكن حذفها', 'error'); return; }  DB.studentStatuses = DB.studentStatuses.filter(s=>s.id!==id);  saveData(DB); renderPage(); toast('تم الحذف');}function addTeacherStatus() {  const v = document.getElementById('new-tstatus').value.trim();  if (!v) return;  DB.teacherStatuses.push({ id: genId(), name: v });  saveData(DB); renderPage(); toast('تمت الإضافة');}function deleteTeacherStatus(id) {  if (DB.teachers.some(t=>t.statusId===id)) { toast('مستخدمة', 'error'); return; }  DB.teacherStatuses = DB.teacherStatuses.filter(s=>s.id!==id);  saveData(DB); renderPage(); toast('تم الحذف');}function factoryReset() {  confirmDialog('حذف كل البيانات نهائيا', '⚠️ سيتم حذف كل الطلاب والمدرسين والمجموعات والحضور والاشتراكات والمصروفات نهائيا والبدء نظيفا.\\n\\nتأكد من وجود نسخة احتياطية قبل المتابعة. هل تريد تنفيذ العملية؟', () => {    confirmDialog('تأكيد نهائي', 'هذه آخر فرصة - كل البيانات ستحذف. متأكد؟', () => {      localStorage.removeItem(STORAGE_KEY);      toast('تم حذف كل البيانات - سيتم إعادة التحميل');      setTimeout(() => location.reload(), 1200);    }, 'نعم احذف نهائيا');  });}
function renderPage() {  if (!requireAuth()) return;  render();}
// PWA registration
if ('serviceWorker' in navigator) {  window.addEventListener('load', () => {    navigator.serviceWorker.register('./sw.js').then(reg => {      console.log('SW registered', reg);    }).catch(err => console.log('SW failed', err));  });}
// Initial render
applyTheme();
render();
