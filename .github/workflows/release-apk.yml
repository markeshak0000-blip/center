name: Release APK - Download Easy FIXED CRASH

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Create Android Project - FIXED CRASH
        run: |
          rm -rf android-app
          mkdir -p android-app/app/src/main/java/com/stgeorge/center
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/index.html 2>/dev/null || echo "<html><body>St George</body></html>" > android-app/app/src/main/assets/index.html
          
          cat > android-app/gradle.properties << 'PROP'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROP
          
          # FIXED MANIFEST - Theme متوافق مع Activity العادي
          cat > android-app/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.stgeorge.center">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:label="سنتر سان جورج" android:supportsRtl="true" android:theme="@android:style/Theme.Black.NoTitleBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize|keyboard">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          # FIXED MainActivity - استخدم Activity العادي مش AppCompat عشان ميعملش Crash
          cat > android-app/app/src/main/java/com/stgeorge/center/MainActivity.java << 'JAVA'
          package com.stgeorge.center;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.graphics.Bitmap;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String SITE_URL = "https://markeshak0000-blip.github.io/center/";
              private static final String LOCAL_URL = "file:///android_asset/index.html";
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  webView = new WebView(this);
                  setContentView(webView);
                  
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setBuiltInZoomControls(false);
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          view.loadUrl(url);
                          return true;
                      }
                      
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                      }
                      
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          // لو النت فشل حمل المحلي
                          if (request.isForMainFrame()) {
                              view.loadUrl(LOCAL_URL);
                          }
                      }
                  });
                  
                  try {
                      webView.loadUrl(SITE_URL);
                  } catch (Exception e) {
                      webView.loadUrl(LOCAL_URL);
                  }
              }
              
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

          cat > android-app/app/src/main/res/layout/activity_main.xml << 'LAYOUT'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
          </FrameLayout>
          LAYOUT

          cat > android-app/app/src/main/res/values/strings.xml << 'STR'
          <resources><string name="app_name">سنتر سان جورج</string></resources>
          STR

          cat > android-app/build.gradle << 'BG'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          BG

          cat > android-app/settings.gradle << 'SG'
          include ':app'
          SG

          # FIXED - مفيش AppCompat عشان ميعملش Crash
          cat > android-app/app/build.gradle << 'ABG'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.stgeorge.center"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              namespace 'com.stgeorge.center'
          }
          dependencies {
              // مفيش AppCompat عشان نتجنب Crash الـ Theme
          }
          ABG

      - name: Build APK FIXED
        run: |
          cd android-app
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk StGeorge-Center-FIXED.apk
          ls -lh StGeorge-Center-FIXED.apk

      - name: Create Release FIXED
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "سنتر سان جورج APK v1.1.${{ github.run_number }} - تم إصلاح التوقف"
          body: "✅ تم إصلاح مشكلة توقف التطبيق\n\nالتطبيق دلوقتي شغال 100%\nحمل الملف StGeorge-Center-FIXED.apk وثبته"
          files: StGeorge-Center-FIXED.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
