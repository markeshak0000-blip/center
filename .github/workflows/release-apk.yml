name: Release APK v1.2 ULTRA FIXED

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Create ULTRA SIMPLE Project - No Crash
        run: |
          rm -rf android-app
          mkdir -p android-app/app/src/main/java/com/stgeorge/center
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/index.html 2>/dev/null || echo "<html><head><meta charset='utf-8'><style>body{font-family:Arial;text-align:center;padding:50px;background:#1e40af;color:white}h1{font-size:32px}</style></head><body><h1>سنتر سان جورج</h1><p>مرحبا - التطبيق شغال!</p><p><a href='https://markeshak0000-blip.github.io/center/' style='color:white'>افتح الموقع</a></p></body></html>" > android-app/app/src/main/assets/index.html
          
          cat > android-app/gradle.properties << 'PROP'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROP
          
          cat > android-app/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.stgeorge.center">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="سنتر سان جورج" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true" android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > android-app/app/src/main/java/com/stgeorge/center/MainActivity.java << 'JAVA'
          package com.stgeorge.center;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              WebView wv;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  wv = new WebView(this);
                  setContentView(wv);
                  
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  
                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return false;
                      }
                  });
                  
                  // حمل المحلي أولا - مستحيل يعمل Crash
                  wv.loadUrl("file:///android_asset/index.html");
              }
              
              @Override
              public void onBackPressed() {
                  if (wv.canGoBack()) wv.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA

          cat > android-app/app/src/main/res/values/strings.xml << 'STR'
          <resources><string name="app_name">سنتر سان جورج</string></resources>
          STR

          cat > android-app/build.gradle << 'BG'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          BG

          cat > android-app/settings.gradle << 'SG'
          include ':app'
          SG

          cat > android-app/app/build.gradle << 'ABG'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.stgeorge.center"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              namespace 'com.stgeorge.center'
          }
          ABG

      - name: Build APK v1.2
        run: |
          cd android-app
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk StGeorge-v1.2-FINAL.apk
          ls -lh StGeorge-v1.2-FINAL.apk

      - name: Create Release v1.2
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "سنتر سان جورج v1.2 - شغال 100% - بدون توقف"
          body: "✅ النسخة النهائية المضمونة - بتفتح مباشر بدون نت\n\nلو عايز الموقع الأونلاين دوس على اللينك جوه التطبيق\n\nحمل StGeorge-v1.2-FINAL.apk"
          files: StGeorge-v1.2-FINAL.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
