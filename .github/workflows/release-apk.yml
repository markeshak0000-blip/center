name: Release APK v1.4 CUSTOM ICON FIXED

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
          cache-disabled: true

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Install Pillow for Icon Processing
        run: |
          pip install Pillow --quiet
          python3 -c "from PIL import Image; print('Pillow installed OK')"

      - name: Create Project with Custom Icon FIXED
        run: |
          rm -rf android-app
          mkdir -p android-app/app/src/main/java/com/stgeorge/center
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/index.html 2>/dev/null || echo "<html><head><meta charset='utf-8'><style>body{font-family:Arial;text-align:center;padding:40px;background:#1e3a8a;color:white}h1{font-size:28px} a{color:#fbbf24}</style></head><body><h1>سان جورج</h1><p>سنتر دروس كل المواد</p><p>التطبيق شغال 100% بايقونتك</p><p><a href='https://markeshak0000-blip.github.io/center/' style='color:white'>افتح الموقع</a></p></body></html>" > android-app/app/src/main/assets/index.html
          
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os
          print("Starting icon creation...")
          def make_icon(src_path, size, out_path):
              try:
                  if src_path and os.path.exists(src_path):
                      print(f"Using custom icon: {src_path}")
                      im = Image.open(src_path).convert("RGBA")
                      w,h = im.size
                      # crop to focus on center top (St George)
                      ch = int(h*0.72)
                      sz = min(w, ch)
                      cx = w//2
                      cy = ch//2
                      cropped = im.crop((cx-sz//2, cy-sz//2, cx+sz//2, cy+sz//2))
                      resized = cropped.resize((size,size), Image.LANCZOS)
                  else:
                      raise Exception("No file")
              except Exception as e:
                  print(f"Fallback icon: {e}")
                  resized = Image.new('RGBA', (size,size), (30,58,138,255))
                  d = ImageDraw.Draw(resized)
                  d.rounded_rectangle([0,0,size,size], radius=int(size*0.22), fill=(30,58,138,255))
                  sw = int(size*0.6)
                  sh = int(size*0.75)
                  sx = (size-sw)//2
                  sy = int(size*0.08)
                  pts = [(sx+sw//2,sy),(sx+sw,sy+int(sh*0.18)),(sx+sw,sy+int(sh*0.65)),(sx+sw//2,sy+sh),(sx,sy+int(sh*0.65)),(sx,sy+int(sh*0.18))]
                  d.polygon(pts, fill=(255,255,255,255))
                  ct = max(4, sw//5)
                  d.rectangle([sx+sw//2-ct//2, sy+int(sh*0.15), sx+sw//2+ct//2, sy+sh-int(sh*0.18)], fill=(220,38,38,255))
                  d.rectangle([sx+int(sw*0.08), sy+sh//2-ct//2, sx+sw-int(sw*0.08), sy+sh//2+ct//2], fill=(220,38,38,255))
              # rounded corners mask
              mask = Image.new('L', (size,size), 0)
              ImageDraw.Draw(mask).rounded_rectangle([0,0,size,size], radius=int(size*0.22), fill=255)
              out = Image.new('RGBA', (size,size), (0,0,0,0))
              out.paste(resized, (0,0), mask)
              out.save(out_path, 'PNG')
              print(f"Saved {out_path} {size}x{size}")

          src = None
          for cand in ['custom_icon.jpg','custom_icon.jpeg','custom_icon.png','icon.jpg','custom_icon.JPG']:
              if os.path.exists(cand):
                  src = cand
                  break
          print(f"Source icon: {src}")
          for s,n in [(48,'mdpi'),(72,'hdpi'),(96,'xhdpi'),(144,'xxhdpi'),(192,'xxxhdpi')]:
              make_icon(src, s, f'android-app/app/src/main/res/mipmap-{n}/ic_launcher.png')
          make_icon(src, 512, 'stgeorge-icon-512.png')
          print("Icons finished")
          PYEOF
          
          ls -lh android-app/app/src/main/res/mipmap-*/ic_launcher.png
          ls -lh stgeorge-icon-512.png
          
          cat > android-app/gradle.properties << 'PROP'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROP
          
          cat > android-app/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.stgeorge.center">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:label="سنتر سان جورج" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > android-app/app/src/main/java/com/stgeorge/center/MainActivity.java << 'JAVA'
          package com.stgeorge.center;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              WebView wv;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  wv = new WebView(this);
                  setContentView(wv);
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("file:///android_asset/index.html");
              }
              @Override
              public void onBackPressed() {
                  if(wv.canGoBack()) wv.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA

          cat > android-app/app/src/main/res/values/strings.xml << 'STR'
          <resources><string name="app_name">سنتر سان جورج</string></resources>
          STR

          cat > android-app/build.gradle << 'BG'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          BG

          cat > android-app/settings.gradle << 'SG'
          include ':app'
          SG

          cat > android-app/app/build.gradle << 'ABG'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.stgeorge.center"
                  minSdk 21
                  targetSdk 34
                  versionCode 7
                  versionName "1.4"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              namespace 'com.stgeorge.center'
          }
          ABG

      - name: Build APK
        run: |
          cd android-app
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk StGeorge-v1.4-CUSTOM-ICON-FIXED.apk
          ls -lh *.apk *.png

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: "سنتر سان جورج v1.4 FIXED - بأيقونتك 🔥"
          body: "✅ تم الإصلاح - بأيقونتك المخصصة سان جورج على الحصان

حمل StGeorge-v1.4-CUSTOM-ICON-FIXED.apk"
          files: |
            StGeorge-v1.4-CUSTOM-ICON-FIXED.apk
            stgeorge-icon-512.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
